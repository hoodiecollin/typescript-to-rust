# tslib — the JS-behavioral-fidelity runtime the translator targets for methods
# whose semantics diverge from the obvious Rust (series 027). The emitter routes
# a *quirk-heavy* method to a `tslib` symbol (fn-first) instead of open-coding the
# behavior inline; clean-mapping methods still emit native idiomatic Rust.
[package]
name = "tslib"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# JSON fidelity (series 045): serialize via serde, render with JS number rules.
# `preserve_order` keeps object keys in insertion order (matches JS / IndexMap).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# I/O (series 100, epic #52). `tokio` (fs feature) backs the async fs helper
# `io::read_dir_async`; `reqwest` (async, rustls TLS so there is no system-
# OpenSSL dependency) backs the `http::get`/`post` client. Both compose with the
# 051 tokio runtime the emitted `#[tokio::main]` provides. Pinned so the offline
# cache stays warm (honor the cargo-dep-thundering-herd first-run flake — re-run
# to confirm green).
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# RegExp fidelity (series 101, epic #56 / Tier-3): the `regex` crate is the
# standard finite-automaton engine (linear-time; no backrefs/lookaround — those
# fail loud at transpile time). Backs `regex::Regex`'s JS-shaped wrappers.
regex = "1"
# Date/time fidelity (series 102, epic #56 / Tier-3). UTC-only usage;
# `default-features = false` drops the system-clock + tz-database code (and the
# historical localtime advisory), leaving pure arithmetic. `to_rfc3339_opts`
# gives exact JS `toISOString()` byte-parity. The test preload pre-warms this on
# a cold cache (fix(harness) 3889f53), so no thundering-herd flake.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
# for the JSON key-order parity test
indexmap = { version = "2", features = ["serde"] }
