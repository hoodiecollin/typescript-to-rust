# tslib — the JS-behavioral-fidelity runtime the translator targets for methods
# whose semantics diverge from the obvious Rust (series 027). The emitter routes
# a *quirk-heavy* method to a `tslib` symbol (fn-first) instead of open-coding the
# behavior inline; clean-mapping methods still emit native idiomatic Rust.
[package]
name = "tslib"
version = "0.1.0"
edition = "2021"

[dependencies]
# JSON fidelity (series 045): serialize via serde, render with JS number rules.
# `preserve_order` keeps object keys in insertion order (matches JS / IndexMap).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# for the JSON key-order parity test
indexmap = { version = "2", features = ["serde"] }
