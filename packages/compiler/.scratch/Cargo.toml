# Persistent scratch crate driven by the verification harness (src/harness).
# The harness swaps source files and runs `cargo check` / `cargo run` against
# emitted Rust. Keeping it persistent preserves the incremental-compile cache,
# so repeated checks stay fast. An explicit empty [workspace] isolates it from
# the repo's root Cargo workspace.
#
# Two targets:
#   - lib (src/lib.rs)  — used by `check`: compiles any item/expression without
#                          requiring a `main`, so bare-function snippets verify.
#   - bin (src/main.rs) — used by `run`: needs a `main`, executes for the
#                          behavioral (differential) oracle.
[package]
name = "ttr_scratch"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
ts-primitives = { path = "../../../crates/ts-primitives" }
# tslib owns JS-behavioral fidelity for quirk-heavy library methods the emitter
# routes to it (series 027) — `Array.at` negative indexing, `String.padStart`…
# Present-but-unused when generated output stays native (costs nothing at check).
tslib = { path = "../../../crates/tslib" }
# Async lowering targets tokio: TS `async function` → `async fn`, and the
# generated `main` becomes `#[tokio::main]`. Pinned so the offline cache stays
# warm; the harness fetches it online on a cold cache. Unused by non-async
# output (a present-but-unused dependency costs nothing at check time). The
# `time` feature backs awaited timers (series 051b): `await sleep(ms)` →
# `tokio::time::sleep(...)`, which does not compile without it.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# futures backs dynamic async fan-out (series 051b): `Promise.all(arr.map(f))` /
# `Promise.allSettled` → `futures::future::join_all` / `try_join_all` (fully
# qualified — no `use` prelude). Present-but-unused by fan-out-free output (costs
# nothing at check time).
futures = "0.3"
# indexmap backs `Record`/object types (series 041): JS objects and `Map`s
# iterate in *insertion order*, which `std::collections::HashMap` does not
# preserve; `IndexMap` does, so `Object.keys`/`values` observe JS order. A
# drop-in for the read/insert/index usage the emitter produces. Unused by
# map-free output (present-but-unused costs nothing at check time).
indexmap = { version = "2", features = ["serde"] }
# serde + serde_json back JSON.parse/stringify (series 045): generated structs
# derive Serialize/Deserialize on demand, JSON.parse → from_str, and the tslib
# JSON fidelity layer renders JS number formatting. `preserve_order` keeps object
# key order. Unused by JSON-free output (costs nothing at check time).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# bumpalo backs the `"use arena"` directive (series 028c): a `"use arena"` scope
# builds its `Vec`s from a bump arena (`bumpalo::vec![in &arena; …]`), freed all
# at once at scope exit. `collections` enables `bumpalo::vec!`/`bumpalo::collections::Vec`.
# Present-but-unused by non-arena output (costs nothing at check time).
bumpalo = { version = "3", features = ["collections"] }
# thiserror backs the whole-program `AppError` enum (series 049): a custom
# `class X extends Error` becomes an `AppError` variant, and the enum derives
# `thiserror::Error` (fully-qualified — no `use` prelude) for its `Display` /
# `std::error::Error` impls. Pinned so the offline cache stays warm; the harness
# fetches it online on a cold cache. Unused by error-enum-free output (a
# present-but-unused dependency costs nothing at check time).
thiserror = "2"
# ordered-float backs scalar-`f64` `Map`/`Set` keys/elements (series 061):
# `OrderedFloat<f64>` supplies `Hash + Eq + Ord` and matches JS SameValueZero
# exactly (`NaN == NaN`, `-0.0`/`+0.0` collapse), so a number-keyed `Map`/`Set`
# translates faithfully. Unused by float-key-free output (costs nothing at check).
ordered-float = "4"

[lib]
name = "ttr_scratch"
path = "src/lib.rs"

[[bin]]
name = "ttr_scratch"
path = "src/main.rs"

[workspace]
