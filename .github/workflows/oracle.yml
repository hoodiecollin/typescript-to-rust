# Full oracle suite — the cargo-backed differential tests (`bun run test`), which
# compile AND run a real Rust crate per fixture through a live cargo toolchain.
# This is the expensive one (~12-13 min warm locally; ~20-40 min on a cold
# runner), so it does NOT run per-PR — the fast checks in `ci.yml` gate those.
#
# Run this PRIOR TO RELEASE:
#   • manually via the Actions tab ("Run workflow") before cutting a release, or
#   • automatically when a version tag `v*` is pushed.
# It runs the complete gate: lint + typecheck + cargo test + the oracle suite.
name: Oracle suite

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle:
    name: full suite (cargo-backed oracle)
    runs-on: ubuntu-latest
    # Ceiling guard: the suite is ~20-40 min cold; 60 leaves headroom without
    # letting a hung cargo invocation run away.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun run lint

      # `check` = typecheck + cargo test + the full cargo-backed oracle suite.
      - name: Full gate (typecheck · cargo test · oracle)
        run: bun run check
